name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cc: gcc
          - name: Clang
            cc: clang
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build warning-clean
        env:
          CC: ${{ matrix.cc }}
        run: ./scripts/build.sh
