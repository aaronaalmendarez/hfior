name: Feature request
description: Propose a focused architecture, integration, or tooling improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem or use case}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed behavior}
    validations: {required: true}
  - type: textarea
    id: invariants
    attributes:
      label: Correctness, security, and compatibility constraints
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: Evidence or prior art}
